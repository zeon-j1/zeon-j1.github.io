<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Vault</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne+Mono&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #161616;
      --border: #2a2a2a;
      --accent: #c8f135;
      --accent-dim: #9db82a;
      --text: #e8e8e8;
      --text-muted: #666;
      --danger: #ff4545;
      --radius: 4px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 18px 40px;
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--accent);
    }
    header span {
      font-family: 'Syne Mono', monospace;
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .layout {
      display: grid;
      grid-template-columns: 240px 1fr;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    aside {
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .sidebar-header {
      padding: 16px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .sidebar-header p {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    #new-btn {
      background: var(--accent);
      color: #0d0d0d;
      border: none;
      border-radius: var(--radius);
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 800;
      width: 28px;
      height: 28px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }
    #new-btn:hover { background: var(--accent-dim); transform: scale(1.05); }

    #file-list {
      flex: 1;
      overflow-y: auto;
      padding: 4px 10px 20px;
    }
    #file-list::-webkit-scrollbar { width: 4px; }
    #file-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .file-item {
      padding: 9px 11px;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 3px;
      border: 1px solid transparent;
      transition: background 0.12s, border-color 0.12s;
      margin-bottom: 2px;
    }
    .file-item:hover { background: var(--surface); border-color: var(--border); }
    .file-item.active { background: #1c1c1c; border-color: var(--accent); }
    .file-item .name {
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .file-item .meta {
      font-family: 'Syne Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
    }
    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: var(--text-muted);
      font-size: 12px;
      line-height: 1.8;
    }

    main {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
    }

    .editor-toolbar {
      padding: 11px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    #filename-input {
      background: transparent;
      border: none;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 15px;
      font-weight: 700;
      flex: 1;
      outline: none;
      border-bottom: 1px solid transparent;
      padding-bottom: 2px;
      transition: border-color 0.15s;
      min-width: 0;
    }
    #filename-input:focus { border-color: var(--accent); }
    #filename-input::placeholder { color: var(--text-muted); }

    .toolbar-actions { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

    .view-toggle {
      display: flex;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }
    .view-toggle button {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-family: 'Syne Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.05em;
      padding: 5px 10px;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
    }
    .view-toggle button:not(:last-child) { border-right: 1px solid var(--border); }
    .view-toggle button.active { background: var(--surface); color: var(--accent); }
    .view-toggle button:hover:not(.active) { color: var(--text); background: #111; }

    .toolbar-divider { width: 1px; height: 20px; background: var(--border); }

    button.action {
      font-family: 'Syne', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 6px 12px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.15s;
    }
    #save-btn { background: var(--accent); color: #0d0d0d; border-color: var(--accent); }
    #save-btn:hover { background: var(--accent-dim); border-color: var(--accent-dim); }
    #delete-btn { background: transparent; color: var(--danger); border-color: var(--danger); }
    #delete-btn:hover { background: rgba(255,69,69,0.08); }
    #export-btn { background: transparent; color: var(--text-muted); }
    #export-btn:hover { color: var(--text); border-color: var(--text-muted); }

    /* Panes */
    .pane-container {
      flex: 1;
      display: flex;
      min-height: 0;
      overflow: hidden;
    }

    #editor {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: 'Syne Mono', monospace;
      font-size: 13px;
      line-height: 1.75;
      padding: 22px 24px;
      resize: none;
      outline: none;
      overflow-y: auto;
      min-width: 0;
    }
    #editor::-webkit-scrollbar { width: 4px; }
    #editor::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .pane-divider {
      width: 1px;
      background: var(--border);
      flex-shrink: 0;
    }

    #preview {
      flex: 1;
      overflow-y: auto;
      padding: 22px 32px;
      min-width: 0;
    }
    #preview::-webkit-scrollbar { width: 4px; }
    #preview::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    /* View modes */
    .pane-container.split #editor,
    .pane-container.split #preview,
    .pane-container.split .pane-divider { display: block; }

    .pane-container.edit-only #editor { display: block; flex: 1; }
    .pane-container.edit-only #preview,
    .pane-container.edit-only .pane-divider { display: none; }

    .pane-container.preview-only #editor,
    .pane-container.preview-only .pane-divider { display: none; }
    .pane-container.preview-only #preview { display: block; flex: 1; }

    /* Markdown styles */
    .md-body { font-family: 'Syne', sans-serif; font-size: 14px; line-height: 1.8; color: var(--text); }
    .md-body h1, .md-body h2, .md-body h3,
    .md-body h4, .md-body h5, .md-body h6 {
      font-weight: 800; margin: 1.4em 0 0.5em; letter-spacing: -0.3px; line-height: 1.3; color: #fff;
    }
    .md-body h1 { font-size: 2em; }
    .md-body h2 { font-size: 1.5em; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
    .md-body h3 { font-size: 1.2em; }
    .md-body h4 { font-size: 1em; color: var(--accent); }
    .md-body p { margin: 0.8em 0; }
    .md-body ul, .md-body ol { padding-left: 1.6em; margin: 0.8em 0; }
    .md-body li { margin: 0.3em 0; }
    .md-body a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-dim); }
    .md-body a:hover { border-color: var(--accent); }
    .md-body code {
      font-family: 'Syne Mono', monospace; font-size: 0.88em;
      background: var(--surface); border: 1px solid var(--border);
      padding: 2px 6px; border-radius: 3px; color: var(--accent);
    }
    .md-body pre {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px 20px; overflow-x: auto; margin: 1em 0;
    }
    .md-body pre code { background: none; border: none; padding: 0; color: #ccc; font-size: 0.9em; }
    .md-body blockquote {
      border-left: 3px solid var(--accent); margin: 1em 0;
      padding: 4px 0 4px 20px; color: var(--text-muted);
    }
    .md-body hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }
    .md-body table { width: 100%; border-collapse: collapse; margin: 1em 0; font-size: 13px; }
    .md-body th {
      background: var(--surface); border: 1px solid var(--border);
      padding: 8px 12px; text-align: left; font-weight: 700; color: var(--accent);
    }
    .md-body td { border: 1px solid var(--border); padding: 7px 12px; }
    .md-body tr:nth-child(even) td { background: rgba(255,255,255,0.02); }
    .md-body img { max-width: 100%; border-radius: var(--radius); }
    .md-body strong { font-weight: 800; color: #fff; }
    .md-body em { font-style: italic; color: #bbb; }

    .status-bar {
      padding: 7px 20px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 20px;
      font-family: 'Syne Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .no-selection {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      gap: 12px;
    }
    .no-selection .icon { font-size: 48px; opacity: 0.2; }
    .no-selection p { font-size: 13px; }
    .no-selection kbd {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 3px; padding: 2px 7px;
      font-family: 'Syne Mono', monospace; font-size: 11px;
    }

    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: var(--accent); color: #0d0d0d;
      font-family: 'Syne', sans-serif; font-size: 13px; font-weight: 700;
      padding: 9px 18px; border-radius: var(--radius);
      transform: translateY(10px); opacity: 0;
      transition: all 0.2s; pointer-events: none; z-index: 100;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
  </style>
</head>
<body>

<header>
  <h1>TEXT VAULT</h1>
  <span>browser storage · markdown</span>
</header>

<div class="layout">
  <aside>
    <div class="sidebar-header">
      <p>Files</p>
      <button id="new-btn" title="New file">+</button>
    </div>
    <div id="file-list"></div>
  </aside>

  <main id="main-area">
    <div class="no-selection">
      <div class="icon">🗄️</div>
      <p>Select a file or create a new one</p>
      <p><kbd>+</kbd> to start</p>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
  const STORAGE_PREFIX = 'textvault_';
  let currentKey = null;
  let currentView = 'split';

  function getAllFiles() {
    const files = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith(STORAGE_PREFIX)) {
        try {
          const data = JSON.parse(localStorage.getItem(k));
          files.push({ key: k, ...data });
        } catch {}
      }
    }
    return files.sort((a, b) => b.modified - a.modified);
  }

  function saveFile(key, name, content) {
    localStorage.setItem(key, JSON.stringify({ name, content, modified: Date.now() }));
  }

  function deleteFile(key) { localStorage.removeItem(key); }
  function newKey() { return STORAGE_PREFIX + Date.now(); }

  function renderSidebar() {
    const list = document.getElementById('file-list');
    const files = getAllFiles();
    if (files.length === 0) {
      list.innerHTML = `<div class="empty-state">No files yet.<br>Click <strong>+</strong> to create one.</div>`;
      return;
    }
    list.innerHTML = files.map(f => `
      <div class="file-item ${f.key === currentKey ? 'active' : ''}" data-key="${f.key}">
        <span class="name">${escHtml(f.name || 'Untitled')}</span>
        <span class="meta">${formatDate(f.modified)} · ${f.content.length} chars</span>
      </div>
    `).join('');
    list.querySelectorAll('.file-item').forEach(el => {
      el.addEventListener('click', () => openFile(el.dataset.key));
    });
  }

  function renderEditor(key) {
    const main = document.getElementById('main-area');
    const data = JSON.parse(localStorage.getItem(key) || '{}');
    const content = data.content || '';

    main.innerHTML = `
      <div class="editor-toolbar">
        <input id="filename-input" type="text" placeholder="Filename…" value="${escHtml(data.name || '')}" spellcheck="false">
        <div class="toolbar-actions">
          <div class="view-toggle">
            <button data-view="edit-only">Edit</button>
            <button data-view="split">Split</button>
            <button data-view="preview-only">View</button>
          </div>
          <div class="toolbar-divider"></div>
          <button class="action" id="export-btn">↓ .md</button>
          <button class="action" id="delete-btn">Delete</button>
          <button class="action" id="save-btn">Save</button>
        </div>
      </div>
      <div class="pane-container" id="pane-container">
        <textarea id="editor" placeholder="Start writing markdown…" spellcheck="false">${escHtml(content)}</textarea>
        <div class="pane-divider"></div>
        <div id="preview"><div class="md-body" id="md-body"></div></div>
      </div>
      <div class="status-bar">
        <span id="char-count">${content.length} chars</span>
        <span id="word-count">${wordCount(content)} words</span>
        <span id="line-count">${lineCount(content)} lines</span>
      </div>
    `;

    const editor = document.getElementById('editor');
    const mdBody = document.getElementById('md-body');
    const filenameInput = document.getElementById('filename-input');
    const paneContainer = document.getElementById('pane-container');

    renderMarkdown(content, mdBody);
    setView(currentView, paneContainer);

    editor.addEventListener('input', () => {
      const v = editor.value;
      renderMarkdown(v, mdBody);
      document.getElementById('char-count').textContent = v.length + ' chars';
      document.getElementById('word-count').textContent = wordCount(v) + ' words';
      document.getElementById('line-count').textContent = lineCount(v) + ' lines';
    });

    document.querySelectorAll('.view-toggle button').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.view === currentView);
      btn.addEventListener('click', () => {
        currentView = btn.dataset.view;
        document.querySelectorAll('.view-toggle button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        setView(currentView, paneContainer);
      });
    });

    document.getElementById('save-btn').addEventListener('click', () => {
      const name = filenameInput.value.trim() || 'Untitled';
      saveFile(key, name, editor.value);
      renderSidebar();
      showToast('Saved ✓');
    });

    document.getElementById('delete-btn').addEventListener('click', () => {
      if (confirm(`Delete "${filenameInput.value || 'Untitled'}"?`)) {
        deleteFile(key);
        currentKey = null;
        renderSidebar();
        showNoSelection();
      }
    });

    document.getElementById('export-btn').addEventListener('click', () => {
      const name = (filenameInput.value.trim() || 'untitled') + '.md';
      const blob = new Blob([editor.value], { type: 'text/markdown' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = name;
      a.click();
    });

    document.addEventListener('keydown', handleKeyDown);
  }

  function setView(view, container) {
    container.className = 'pane-container ' + view;
  }

  function renderMarkdown(text, el) {
    el.innerHTML = marked.parse(text, { breaks: true, gfm: true });
  }

  function handleKeyDown(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      document.getElementById('save-btn')?.click();
    }
  }

  function showNoSelection() {
    document.removeEventListener('keydown', handleKeyDown);
    document.getElementById('main-area').innerHTML = `
      <div class="no-selection">
        <div class="icon">🗄️</div>
        <p>Select a file or create a new one</p>
        <p><kbd>+</kbd> to start</p>
      </div>
    `;
  }

  function openFile(key) {
    currentKey = key;
    renderSidebar();
    renderEditor(key);
  }

  document.getElementById('new-btn').addEventListener('click', () => {
    const key = newKey();
    saveFile(key, 'Untitled', '');
    openFile(key);
    renderSidebar();
    setTimeout(() => {
      const input = document.getElementById('filename-input');
      if (input) { input.focus(); input.select(); }
    }, 50);
  });

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function formatDate(ts) {
    return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  function wordCount(s) { return s.trim() ? s.trim().split(/\s+/).length : 0; }
  function lineCount(s) { return s ? s.split('\n').length : 1; }
  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 1800);
  }

  renderSidebar();
</script>
</body>
</html>
